name: Check pull request shape

# Syncs, topics on quattro, and stacks of any depth whose trunk is quattro are
# the shapes an agent can open. Every topic and stack layer is capped against
# its own base and may not carry upstream commits. i18n-sync is a sync. This
# job runs the shape tests plus the layout and polkit checks.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the pull request shape
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/pr-shape-check.sh
      - name: Install test commands
        run: |
          sudo apt-get update
          sudo apt-get install -y jq lua5.4
          if ! command -v lua >/dev/null; then
            sudo ln -sf "$(command -v lua5.4)" /usr/bin/lua
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Shape, layout, and polkit tests
        run: |
          bash test/shell.d/pr-shape-check-test.sh
          bash test/shell.d/hyprland-floating-workspaces-test.sh
          bash test/shell.d/polkit-face-test.sh
